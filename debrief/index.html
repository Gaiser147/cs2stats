<style>
:root {
  --room: #e3e7e8;
  --board: #f2f4f3;
  --ink: #1c1e23;
  --ink-2: #444952;
  --blue: #1f4fbf;
  --red: #d62f2a;
  --red-text: #b5221d;
  --hand: "Permanent Marker", "Marker Felt", "Segoe Print", "Bradley Hand", cursive;
  --sans: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--room); }
body { margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--room); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; touch-action: none; }
::selection { background: #f5c48f; color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
a { color: var(--blue); text-underline-offset: .2em; text-decoration-thickness: 1.5px; }
b { font-weight: 700; }
.lobby { color: var(--blue); font-weight: 600; }
.fix { color: var(--red-text); font-weight: 700; }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: fixed; inset: 0; pointer-events: none; }

/* captions under the board (phone) or beside it (desktop) */
.cap {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 8px; opacity: 0; will-change: opacity, transform;
  padding: 34px 22px 26px;
  background: linear-gradient(to top, var(--room) calc(100% - 26px), rgba(227, 231, 232, 0));
}
@supports (padding: max(1px, 2px)) { .cap { padding: 34px max(22px, env(safe-area-inset-right, 0px)) max(26px, calc(env(safe-area-inset-bottom, 0px) + 16px)) max(22px, env(safe-area-inset-left, 0px)); } }
.cap h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: clamp(22px, 6vw, 30px); line-height: 1.12; text-wrap: balance; max-width: 22ch; }
.cap p { margin: 0; color: var(--ink-2); max-width: 48ch; text-wrap: pretty; }
.cap p b { color: var(--ink); }
.cap .again { font-size: 14px; color: var(--ink-2); }
@media (min-aspect-ratio: 21/20) {
  .cap { left: auto; right: 0; top: 0; bottom: 0; width: min(38vw, 460px); align-content: center; gap: 12px;
    padding: 40px 48px 40px 28px; background: linear-gradient(to left, var(--room) 80%, rgba(227, 231, 232, 0)); }
  .cap h2 { font-size: clamp(28px, 2.6vw, 40px); }
  .cap p { font-size: 17px; }
}

/* swipe hint on the first page */
.hint { position: absolute; left: 0; right: 0; bottom: max(26px, calc(env(safe-area-inset-bottom, 0px) + 18px)); display: grid; justify-items: center; gap: 6px; opacity: 0; transition: opacity .5s; padding: 0 22px; text-align: center; }
.hint span { font-family: var(--hand); font-size: 19px; max-width: 24ch; text-wrap: balance; }
.hint svg { width: 34px; height: 46px; animation: nudge 1.8s var(--ease) infinite; }
@keyframes nudge { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-12px); } }
@media (min-aspect-ratio: 21/20) { .hint { left: auto; right: 0; width: min(38vw, 460px); bottom: 50%; transform: translateY(50%); } }

.labels { position: absolute; inset: 0; }
.lbl { position: absolute; left: 0; top: 0; font-family: var(--hand); font-size: 17px; line-height: 1; white-space: nowrap; transform: translate(-50%, -50%); opacity: 0; }
.lbl.red { color: var(--red-text); } .lbl.blue { color: var(--blue); }
.lbl.count { font-size: 30px; color: var(--red); }
#rings { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* the flash: the whole screen goes white for a moment */
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px; }
#flash strong { font-family: var(--hand); font-weight: 400; font-size: clamp(54px, 16vw, 110px); line-height: 1; color: var(--ink); }
#flash span { font-size: 18px; color: var(--ink-2); max-width: 30ch; justify-self: center; }

/* skip links for keyboard and screen reader users */
.nav-sr { position: fixed; top: 10px; left: 10px; display: flex; gap: 8px; z-index: 5; }
.nav-sr button { position: absolute; left: -9999px; font: 600 15px var(--sans); padding: 10px 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--board); color: var(--ink); }
.nav-sr button:focus { position: static; }

/* the drills: a sheet that slides over the board after the last page */
.sheet { position: fixed; inset: 0; z-index: 4; background: var(--room); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; transform: translateY(102%); transition: transform .7s var(--ease); box-shadow: 0 -10px 30px rgba(28, 30, 35, .18); }
.sheet.open { transform: none; }
.sheet .inner { max-width: 760px; margin: 0 auto; display: grid; gap: 26px; padding: 34px 22px 48px; }
@supports (padding: max(1px, 2px)) { .sheet .inner { padding: max(34px, calc(env(safe-area-inset-top, 0px) + 20px)) max(22px, env(safe-area-inset-right, 0px)) max(48px, calc(env(safe-area-inset-bottom, 0px) + 30px)) max(22px, env(safe-area-inset-left, 0px)); } }
.sheet .grab { justify-self: center; width: 44px; height: 5px; border-radius: 3px; background: #a4aab0; }
.sheet h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: clamp(30px, 7vw, 46px); line-height: 1.1; }
.sheet .back { justify-self: start; font: 600 15px var(--sans); background: none; border: 0; padding: 4px 0; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: .2em; }
.drill { display: grid; gap: 6px; padding-top: 18px; border-top: 2.5px solid var(--ink); }
.drill h3 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 23px; line-height: 1.15; }
.drill p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.drill .state { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.drill .state b.ok { color: var(--ink); }
.foot { font-size: 14px; color: var(--ink-2); display: grid; gap: 6px; padding-top: 22px; border-top: 1.5px dashed #9aa0a6; }
.foot code { font-size: 13px; background: var(--board); padding: 2px 6px; border-radius: 3px; overflow-wrap: anywhere; }

/* without WebGL: the board pages as flat images in a normal scrolling page */
.flat { display: none; }
.nogl body, body.nogl { overflow: auto; touch-action: auto; }
body.nogl .flat { display: grid; gap: 28px; justify-items: center; padding: 24px 16px; }
body.nogl .overlay, body.nogl #gl, body.nogl .nav-sr { display: none; }
body.nogl .sheet { position: static; transform: none; box-shadow: none; overflow: visible; }
.flat figure { margin: 0; display: grid; gap: 10px; max-width: 760px; width: 100%; }
.flat canvas { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 6px 18px rgba(28,30,35,.18); background: var(--board); }
.flat figcaption { display: grid; gap: 6px; }
.flat figcaption h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 24px; }
.flat figcaption p { margin: 0; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { .hint svg { animation: none; } .sheet { transition: none; } }
</style>

function egoPose(f, base) {

const lerpPose = (a, b, k) => ({ pos: a.pos.clone().lerp(b.pos, k), tgt: a.tgt.clone().lerp(b.tgt, k), up: a.up.clone().lerp(b.up, k).normalize(), fov: lerp(a.fov, b.fov, k), ox: lerp(a.ox, b.ox, k), oy: lerp(a.oy, b.oy, k), near: Math.min(a.near || .02, b.near || .02) });

// ---------------- overlay ----------------
const labelsEl = document.getElementById('labels');

const LB = { head: mkL('Kopf'), lob: mkL('Lobby', 'blue'), start: mkL('dein Start', 'red'), count: mkL('', 'count') };

// ---------------- state machine ----------------
let cur = 0, TR = null, arriveT = performance.now(), pending = 0, flickF = 0, sheetOpen = false;
let t0 = null;

let P = params(0);

function go(to) {

  const needDraw = setFace(B.face, B.page, !REDUCED);

function step(dir) {

const sheet = document.getElementById('sheet');
function openSheet() { sheetOpen = true; sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false'); sheet.scrollTop = 0; setTimeout(() => document.getElementById('back').focus({ preventScroll: true }), 50); }

document.getElementById('back').addEventListener('click', closeSheet);

function poseOf(i, f) { const st = STATES[i]; return st.cam === 'ego' ? egoPose(f, POSES[i]) : POSES[i]; }

function frame(now) {

    }

    const u = (now - arriveT) / 1000;
    if (cur === 3) { flickF = REDUCED ? 0 : ease((u - .4) / 1.3); if (u < 1.8) busy = true; }
    pose = poseOf(cur, flickF);
    if (STATES[cur].util && !sheetOpen) { if (utilFX(STATES[cur].util, u - .2)) busy = true; }
    capEls.forEach((el, i) => { el.style.opacity = i === cur ? out(u / .4) : 0; });
    if (u < .5) busy = true;
  }

  if (!REDUCED && cur === 0 && !TR && iu < 3.2) {
    const k = 1 - out(iu / 2.2); pose = { ...pose, pos: pose.tgt.clone().add(pose.pos.clone().sub(pose.tgt).multiplyScalar(1 + .55 * k)).add(V(.4 * k, .1 * k, 0)) };
    busy = true;
  }
  { const F = faces.F; if (!TR && cur === 0 && F.page === 'title' && F.prog < 1) { const pr = clamp((iu - .6) / F.ops.dur); if (pr >= 1 || now - F.lastPaint > 30) { F.prog = pr; paintFace(F); F.lastPaint = now; } busy = true; } }

  m1.visible = isFlatB(th) && pages.includes('map1'); m2.visible = isFlatB(th) && pages.includes('map2'); mU.visible = isFlatF(th) && pages.includes('utilmap');
  const lying = Math.abs(Math.cos(th)) < .5; boardCasters.forEach(o => { o.castShadow = !lying; }); faces.F.mesh.receiveShadow = faces.B.mesh.receiveShadow = lying;
  const grow = (o, mag, fig) => { o.base.scale.setScalar(Math.max(.001, out(mag * 1.15) )); o.fig.scale.setScalar(Math.max(.001, fig)); };
  [you1, foe1].forEach(o => grow(o, P.mag1, P.fig1)); you1.root.visible = P.hide1 < .5;
  w1.forEach(w => { w.visible = P.wall1 > .01; w.scale.y = Math.max(.001, P.wall1); });
  rays.visible = P.rays1 > .01; redM.opacity = blueM.opacity = blackM.opacity = P.rays1; headLine.visible = P.wall1 > .9;
  [youU, foeU].forEach(o => grow(o, P.magU, P.figU)); wU.forEach(w => { w.visible = P.wallU > .01; w.scale.y = Math.max(.001, P.wallU); });

}
let running = false;
function tick(now) { const busy = frame(now); if (busy) requestAnimationFrame(tick); else running = false; }

// ---------------- input: one gesture, one page ----------------
let wheelAcc = 0, wheelT = 0, wheelLock = false;
addEventListener('wheel', e => {

  e.preventDefault();

}, { passive: false });
let ty = null, tx0 = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; tx0 = e.touches[0].clientX; }, { passive: true });

}, { passive: true });

// ---------------- start ----------------
function layout() { W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; rings.setAttribute('viewBox', `0 0 ${W} ${H}`); computePoses(); }
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); kick(); }, 150); });
layout();
setFace('F', 'title', !REDUCED);
{ const c = faces.B.ctx; c.setTransform(SC, 0, 0, SC, 0, 0); boardBase(c, 3); faces.B.tex.needsUpdate = true; }
kick();
