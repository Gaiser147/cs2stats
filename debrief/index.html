<style>
:root {
  --room: #e3e7e8;
  --board: #f2f4f3;
  --ink: #1c1e23;
  --ink-2: #444952;
  --blue: #1f4fbf;
  --red: #d62f2a;
  --red-text: #b5221d;
  --orange: #e8862a;
  --hand: "Permanent Marker", "Marker Felt", "Segoe Print", "Bradley Hand", cursive;
  --sans: "Archivo", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--room); }
body { margin: 0; background: var(--room); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
::selection { background: #f5c48f; color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
a { color: var(--blue); text-underline-offset: .2em; text-decoration-thickness: 1.5px; }
b { font-weight: 700; }
.lobby { color: var(--blue); font-weight: 600; }
.fix { color: var(--red-text); font-weight: 700; }

#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
.track { position: relative; z-index: 1; }
.overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

/* captions under the board (phone) or beside it (desktop) */
.cap {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 8px; opacity: 0; will-change: opacity, transform;
  padding: 40px max(22px, env(safe-area-inset-right, 0px)) max(26px, calc(env(safe-area-inset-bottom, 0px) + 16px)) max(22px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--room) calc(100% - 30px), rgba(227, 231, 232, 0));
}
.cap h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: clamp(22px, 6vw, 30px); line-height: 1.12; text-wrap: balance; max-width: 22ch; }
.cap p { margin: 0; color: var(--ink-2); max-width: 48ch; text-wrap: pretty; }
.cap p b { color: var(--ink); }
@media (min-aspect-ratio: 21/20) {
  .cap { left: auto; right: 0; top: 0; bottom: 0; width: min(38vw, 460px); align-content: center; gap: 12px;
    padding: 40px max(48px, env(safe-area-inset-right, 0px)) 40px 28px; background: linear-gradient(to left, var(--room) 78%, rgba(227, 231, 232, 0)); }
  .cap h2 { font-size: clamp(28px, 2.6vw, 40px); }
  .cap p { font-size: 17px; }
}

.start {
  position: absolute; left: 0; right: 0; bottom: max(22px, calc(env(safe-area-inset-bottom, 0px) + 14px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); pointer-events: auto;
}
.start p { flex-basis: 100%; text-align: center; margin: 0 0 4px; color: var(--ink-2); font-size: 15px; }
.btn {
  appearance: none; border: 2px solid var(--ink); border-radius: 999px; padding: 12px 22px; font: 700 16px/1 var(--sans); cursor: pointer;
  background: transparent; color: var(--ink); transition: transform .2s var(--ease), background .2s, color .2s;
}
.btn.primary { background: var(--ink); color: var(--board); }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
@media (min-aspect-ratio: 21/20) { .start { left: auto; width: min(38vw, 460px); justify-content: flex-start; padding-left: 28px; bottom: 15vh; } .start p { text-align: left; } }

.labels { position: absolute; inset: 0; }
.lbl { position: absolute; left: 0; top: 0; font-family: var(--hand); font-size: 17px; line-height: 1; white-space: nowrap; transform: translate(-50%, -50%); opacity: 0; }
.lbl.red { color: var(--red-text); } .lbl.blue { color: var(--blue); }
.lbl.count { font-size: 30px; color: var(--red); }
#rings { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* after the board: the drills, as plain reading text */
.end { position: relative; z-index: 3; background: var(--room); box-shadow: 0 -18px 30px rgba(227, 231, 232, 1); padding: 56px 22px 40px; }
@supports (padding: max(1px, 2px)) { .end { padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); } }
.end .inner { max-width: 760px; margin: 0 auto; display: grid; gap: 26px; }
.end h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: clamp(30px, 7vw, 46px); line-height: 1.1; }
.drill { display: grid; gap: 6px; padding-top: 18px; border-top: 2.5px solid var(--ink); }
.drill h3 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 23px; line-height: 1.15; }
.drill p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.drill .state { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.drill .state b.ok { color: var(--ink); }
.foot { font-size: 14px; color: var(--ink-2); display: grid; gap: 6px; padding-top: 22px; border-top: 1.5px dashed #9aa0a6; }
.foot code { font-size: 13px; background: var(--board); padding: 2px 6px; border-radius: 3px; overflow-wrap: anywhere; }

/* without WebGL: the board pages as flat images */
.flat { display: none; position: relative; z-index: 3; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.nogl .flat { display: grid; gap: 28px; justify-items: center; }
.nogl .track, .nogl .overlay, .nogl #gl { display: none; }
.flat figure { margin: 0; display: grid; gap: 10px; max-width: 760px; width: 100%; }
.flat canvas { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 6px 18px rgba(28,30,35,.18); background: var(--board); }
.flat figcaption { display: grid; gap: 6px; }
.flat figcaption h2 { margin: 0; font-family: var(--hand); font-weight: 400; font-size: 24px; }
.flat figcaption p { margin: 0; color: var(--ink-2); }

@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

const you2 = soldier('t', 0xe8862a), ent2 = soldier('t', 0xf2f2f0), foe2 = soldier('ct', 0x3a3d43);
you2.root.position.set(MAP2.you[0], 0, -MAP2.you[1]); face2(you2.root, MAP2.foe[0] - MAP2.you[0], MAP2.foe[1] - MAP2.you[1]); m2.add(you2.root);
ent2.root.position.set(MAP2.entry[0], 0, -MAP2.entry[1]); face2(ent2.root, MAP2.foe[0] - MAP2.entry[0], MAP2.foe[1] - MAP2.entry[1]); m2.add(ent2.root);
foe2.root.position.set(MAP2.foe[0], 0, -MAP2.foe[1]); face2(foe2.root, MAP2.entry[0] - MAP2.foe[0], MAP2.entry[1] - MAP2.foe[1]); m2.add(foe2.root);

// ---------------- camera poses ----------------
let W = 1, H = 1;
const v3 = new T.Vector3();
function setCam(pos, tgt, up, fov, ox, oy, near = .02) {
  camera.position.copy(pos); camera.up.copy(up); camera.fov = fov; camera.near = near; camera.lookAt(tgt);
  camera.setViewOffset(W, H, ox * W, oy * H, W, H); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}
function fit(pose, dir, pts, box) {
  pose.ox = .5 - (box[0] + box[1]) / 2; pose.oy = .5 - (box[2] + box[3]) / 2;
  const ok = d => { setCam(pose.tgt.clone().addScaledVector(dir, d), pose.tgt, pose.up, pose.fov, pose.ox, pose.oy); return pts.every(p => { v3.copy(p).project(camera); const x = (v3.x + 1) / 2, y = (1 - v3.y) / 2; return v3.z < 1 && x >= box[0] && x <= box[1] && y >= box[2] && y <= box[3]; }); };
  let lo = .2, hi = 30; for (let i = 0; i < 28; i++) { const md = (lo + hi) / 2; if (ok(md)) hi = md; else lo = md; }
  pose.pos = pose.tgt.clone().addScaledVector(dir, hi);
}
const desk = () => W / H > 1.05;
const BOX = () => desk() ? [.04, .6, .06, .94] : [.035, .965, .035, .66];
let POSES = [];
function worldOf(root, x, h, y) { return root.localToWorld(V(x, h, -y)); }
function computePoses() {
  const keep = pivot.rotation.x;
  POSES = STATES.map(st => {
    pivot.rotation.x = st.th; pivot.updateMatrixWorld(true);
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([a, b]) => pivot.localToWorld(V(a * (BW / 2 + .03), b * (BH / 2 + .03), 0)));
    const ctr = pivot.localToWorld(V(0, 0, 0));
    if (st.cam === 'face') { const p = { tgt: ctr, up: Y.clone(), fov: 35 }; const feet = desk() ? [V(-postX - .03, 0, .32), V(postX + .03, 0, .32)] : []; fit(p, V(0, .07, 1).normalize(), corners.concat(feet), BOX()); return p; }
    if (st.cam === 'top') { const p = { tgt: ctr, up: V(0, 0, -1), fov: 35 }; fit(p, Y.clone(), corners, BOX()); return p; }
    if (st.cam === 'side') {
      const one = st.page === 'map1', root = one ? m1 : m2, mp = one ? MAP1 : MAP2;
      const a = one ? mp.P : mp.you, b = one ? mp.E : mp.foe;
      const t2 = norm2([b[0] - a[0], b[1] - a[1]]), dd = Math.hypot(b[0] - a[0], b[1] - a[1]);
      let perp = [-t2[1], t2[0]];
      if (one) { const wc = mp.walls[0], wcx = (wc[0] + wc[2]) / 2 - (a[0] + b[0]) / 2, wcy = (wc[1] + wc[3]) / 2 - (a[1] + b[1]) / 2; if (perp[0] * wcx + perp[1] * wcy > 0) perp = [-perp[0], -perp[1]]; }
      else if (perp[0] > 0) perp = [-perp[0], -perp[1]];
      const tl = [a[0] + t2[0] * dd * .5, a[1] + t2[1] * dd * .5];
      const p = { tgt: worldOf(root, tl[0], .9, tl[1]), up: Y.clone(), fov: 40 };
      const fromL = one ? worldOf(root, tl[0] + perp[0] * .62 - t2[0] * .6, .9 + .38, tl[1] + perp[1] * .62 - t2[1] * .6) : worldOf(root, tl[0] + perp[0] * .35 - t2[0] * .7, .9 + .95, tl[1] + perp[1] * .35 - t2[1] * .7);
      const dir = fromL.sub(p.tgt).normalize();
      const pts = [worldOf(root, a[0], 2.0, a[1]), worldOf(root, a[0] + perp[0] * .5, 0, a[1] + perp[1] * .5), worldOf(root, b[0], 2.0, b[1]), worldOf(root, b[0], 0, b[1])];
      if (!one) pts.push(worldOf(root, mp.entry[0], 2, mp.entry[1]), worldOf(root, mp.entry[0], 0, mp.entry[1]));
      fit(p, dir, pts, desk() ? [.1, .6, .12, .88] : [.06, .94, .12, .64]);
      return p;
    }
    return { ego: true, tgt: ctr, pos: ctr.clone(), up: Y.clone(), fov: desk() ? 58 : 68, ox: desk() ? .5 - .33 : 0, oy: desk() ? 0 : .5 - .36 };
  });
  pivot.rotation.x = keep; pivot.updateMatrixWorld(true);
}
function egoPose(f, base) {
  const dir2 = rot2(TOE, S.pre * DEG * (1 - f));
  const eye = worldOf(m1, MAP1.P[0] + dir2[0] * .25, EYE, MAP1.P[1] + dir2[1] * .25);
  const tgt = worldOf(m1, MAP1.P[0] + dir2[0] * 6, EYE, MAP1.P[1] + dir2[1] * 6);
  return { pos: eye, tgt, up: Y.clone(), fov: base.fov, ox: base.ox, oy: base.oy, near: .002 };
}

// ---------------- overlay ----------------
const labelsEl = document.getElementById('labels');
const mkL = (t, cls = '') => { const s = document.createElement('span'); s.className = 'lbl ' + cls; s.textContent = t; labelsEl.appendChild(s); return s; };
const LB = { head: mkL('Kopf'), lob: mkL('Lobby', 'blue'), start: mkL('dein Start', 'red'), count: mkL('', 'count') };
const rings = document.getElementById('rings'), rHead = document.getElementById('rHead'), rLob = document.getElementById('rLob'), rStart = document.getElementById('rStart'), rCross = document.getElementById('rCross');
function proj(p) { v3.copy(p).project(camera); return [(v3.x + 1) / 2 * W, (1 - v3.y) / 2 * H, v3.z < 1]; }
function putL(el, p, op, dx = 0, dy = 0) { if (op < .02) { el.style.opacity = 0; return; } const [x, y, ok] = proj(p), half = el.offsetWidth / 2 + 8; el.style.opacity = ok ? op : 0; el.style.transform = `translate(${Math.max(half, Math.min(W - half, x + dx)).toFixed(1)}px, ${(y + dy).toFixed(1)}px) translate(-50%, -50%)`; }
function putG(g, p, op) { const [x, y, ok] = proj(p); g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`); g.setAttribute('opacity', ok ? op : 0); }

// ---------------- frame ----------------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sm = v => { v = clamp(v); return v * v * (3 - 2 * v); };
const lerp = (a, b, k) => a + (b - a) * k;
const lerpPose = (a, b, k) => ({ pos: a.pos.clone().lerp(b.pos, k), tgt: a.tgt.clone().lerp(b.tgt, k), up: a.up.clone().lerp(b.up, k).normalize(), fov: lerp(a.fov, b.fov, k), ox: lerp(a.ox, b.ox, k), oy: lerp(a.oy, b.oy, k), near: Math.min(a.near || .02, b.near || .02) });
const topOf = page => POSES[STATES.findIndex(s => s.page === page && s.cam === 'top')];
const t0 = performance.now();
const start = document.getElementById('start');
const qTmp = new T.Quaternion(), pTmp = new T.Vector3();

function render(p, now) {
  const s = clamp(Math.floor(p + .1), 0, NST - 1), frac = p - s, k = sm((frac - .3) / .6), nx = Math.min(NST - 1, s + 1);
  setPage('F', pageFor('F', s), true); setPage('B', pageFor('B', s), true);
  const A = STATES[s], B = STATES[nx];
  const routed = (A.cam === 'side' || A.cam === 'ego') && B.cam === 'face';
  const kRot = routed ? sm((k - .5) * 2) : k;
  pivot.rotation.x = lerp(A.th, B.th, kRot);
  pivot.updateMatrixWorld(true);
  const f = s === 3 ? sm((p - 2.95) / .3) : (s > 3 ? 1 : 0);
  const poseAt = i => STATES[i].cam === 'ego' ? egoPose(i === 3 ? f : 1, POSES[i]) : POSES[i];
  let pose;
  if (k <= 0 || s === nx) pose = poseAt(s);
  else if (routed) { const mid = topOf(A.page); pose = k < .5 ? lerpPose(poseAt(s), mid, sm(k * 2)) : lerpPose(mid, poseAt(nx), sm((k - .5) * 2)); }
  else pose = lerpPose(poseAt(s), poseAt(nx), k);
  // intro: ease in towards the board
  const intro = REDUCED ? 0 : 1 - sm(clamp((now - t0) / 2200));
  if (intro > 0 && p < .35) pose = { ...pose, pos: pose.tgt.clone().add(pose.pos.clone().sub(pose.tgt).multiplyScalar(1 + .55 * intro)).add(V(.4 * intro, .1 * intro, 0)) };
  setCam(pose.pos, pose.tgt, pose.up, pose.fov, pose.ox, pose.oy, pose.near || .02);
  const cd = pose.pos.distanceTo(pose.tgt); scene.fog.near = cd + 1.6; scene.fog.far = cd + 9;

  // maps: walls and figures stand up out of the drawing
  m1.visible = Math.abs(pivot.rotation.x - PI / 2) < .3; m2.visible = Math.abs(pivot.rotation.x - 3 * PI / 2) < .3;
  const g1 = sm((p - 1.35) / .45), wl1 = Math.max(.02, sm((p - 1.3) / .5));
  m1walls.forEach(w => { w.scale.y = wl1; }); [you1, foe1].forEach(o => o.fig.scale.setScalar(Math.max(.001, g1)));
  you1.root.visible = p < 2.62;
  const ro = sm((p - 1.5) / .3) * (1 - sm((p - 2.35) / .25)); rays.visible = ro > .01; redM.opacity = blueM.opacity = blackM.opacity = ro;
  headLine.visible = p > 1.45;
  const g2 = sm((p - 6.35) / .45), wl2 = Math.max(.02, sm((p - 6.3) / .5));
  m2walls.forEach(w => { w.scale.y = wl2; }); [you2, ent2, foe2].forEach(o => o.fig.scale.setScalar(Math.max(.001, g2)));

  // marker reveal when a freshly written side turns to you
  pivot.getWorldQuaternion(qTmp);
  ['F', 'B'].forEach(fk => {
    const F = faces[fk]; if (!F.pending) return;
    const nrm = V(0, 0, fk === 'F' ? 1 : -1).applyQuaternion(qTmp);
    const toCam = camera.position.clone().sub(F.mesh.getWorldPosition(pTmp)).normalize();
    if (nrm.dot(toCam) > .35) { F.pending = false; F.revealT0 = now; }
  });
  let animating = false;
  ['F', 'B'].forEach(fk => { const F = faces[fk]; if (F.revealT0 >= 0) { const r = clamp((now - F.revealT0) / 1100); F.mat.userData.reveal.value = r; if (r < 1) animating = true; else F.revealT0 = -1; } });
  renderer.render(scene, camera);

  // first-person overlay
  const cOp = (s === 3 || (s === 2 && frac > .3)) ? sm((p - 2.78) / .1) * (1 - sm((p - 3.32) / .06)) : 0;
  const head = worldOf(m1, MAP1.E[0], EYE, MAP1.E[1]), lobP = worldOf(m1, MAP1.P[0] + LOB[0] * DIST, EYE, MAP1.P[1] + LOB[1] * DIST), stP = worldOf(m1, MAP1.P[0] + AIM[0] * DIST, EYE, MAP1.P[1] + AIM[1] * DIST);
  const showL = cOp * sm((f - .2) / .2);
  putL(LB.head, head, cOp, 0, -36); putG(rHead, head, cOp);
  putL(LB.lob, lobP, showL, 0, -30); putG(rLob, lobP, showL);
  putL(LB.start, stP, showL, 0, 30); putG(rStart, stP, showL);
  const cx = W * (.5 - pose.ox), cy = H * (.5 - pose.oy);
  rCross.setAttribute('transform', `translate(${cx.toFixed(1)} ${cy.toFixed(1)})`); rCross.setAttribute('opacity', cOp);
  LB.count.textContent = `${de(S.pre * (1 - f))}°`; LB.count.style.opacity = cOp; LB.count.style.transform = `translate(${(cx + 66).toFixed(1)}px, ${(cy - 4).toFixed(1)}px) translate(-50%, -50%)`;

  // captions and start buttons
  capEls.forEach((el, i) => {
    let op;
    if (REDUCED) op = Math.round(p) === i ? 1 : 0;
    else { const a = i === 0 ? -1 : i - .36, b = i + .44; op = clamp(Math.min((p - a) / .06, (b - p) / .06)); }
    el.style.opacity = op; el.style.transform = `translateY(${((1 - op) * 10).toFixed(1)}px)`;
  });
  const so = 1 - sm(p / .08); start.style.opacity = so; start.style.pointerEvents = so > .5 ? 'auto' : 'none'; start.setAttribute('aria-hidden', so < .5 ? 'true' : 'false');
  return animating || intro > 0;
}

// ---------------- scroll ----------------
const track = document.getElementById('track');
let stepPx = 1, pTarget = 0, pNow = 0, running = false;
function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false); camera.aspect = W / H;
  rings.setAttribute('viewBox', `0 0 ${W} ${H}`);
  stepPx = H * 1.1; track.style.height = `${PMAX * stepPx + H}px`;
  computePoses();
}
function readScroll() { pTarget = clamp(scrollY / stepPx, 0, PMAX); if (REDUCED) pTarget = Math.round(pTarget); }
function tick(now) {
  pNow = REDUCED ? pTarget : lerp(pNow, pTarget, .12);
  if (Math.abs(pNow - pTarget) < .0005) pNow = pTarget;
  const busy = render(pNow, now);
  if (busy || pNow !== pTarget) requestAnimationFrame(tick); else running = false;
}
function kick() { if (!running) { running = true; requestAnimationFrame(tick); } }
addEventListener('scroll', () => { readScroll(); kick(); }, { passive: true });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { layout(); readScroll(); kick(); }, 150); });
document.getElementById('go').addEventListener('click', () => scrollTo({ top: stepPx * 1, behavior: REDUCED ? 'auto' : 'smooth' }));
document.getElementById('toPlan').addEventListener('click', () => scrollTo({ top: stepPx * (NST - 1), behavior: REDUCED ? 'auto' : 'smooth' }));
layout(); readScroll(); pNow = pTarget;
setPage('F', pageFor('F', 0), false); setPage('B', pageFor('B', 0), false);
if (!REDUCED && pNow < .3) { faces.F.mat.userData.reveal.value = 0; faces.F.revealT0 = t0 + 700; }
kick();
})();
</script>
